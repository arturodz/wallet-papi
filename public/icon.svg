<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Wallet PAPI">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#10161f"/>
      <stop offset="1" stop-color="#0b0f14"/>
    </linearGradient>
    <radialGradient id="whiteGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="redGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff4d4d" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ff4d4d" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- dark rounded-square panel -->
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="3" y="3" width="506" height="506" rx="109" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="6"/>

  <!-- runway: receding centerline toward the lights -->
  <g opacity="0.5">
    <!-- runway edges (perspective trapezoid) -->
    <path d="M 196 392 L 316 392 L 292 196 L 220 196 Z" fill="#1b2430"/>
    <!-- dashed centerline -->
    <g fill="#3a4759">
      <rect x="252" y="356" width="8" height="34" rx="4"/>
      <rect x="252.5" y="312" width="7" height="28" rx="3.5"/>
      <rect x="253" y="276" width="6" height="22" rx="3"/>
      <rect x="253.5" y="246" width="5" height="18" rx="2.5"/>
    </g>
  </g>

  <!-- PAPI: row of four lights, two white + two red -->
  <!-- glows -->
  <circle cx="176" cy="196" r="52" fill="url(#whiteGlow)"/>
  <circle cx="240" cy="196" r="52" fill="url(#whiteGlow)"/>
  <circle cx="304" cy="196" r="52" fill="url(#redGlow)"/>
  <circle cx="368" cy="196" r="52" fill="url(#redGlow)"/>

  <!-- light housings -->
  <g stroke="#0b0f14" stroke-width="4">
    <circle cx="176" cy="196" r="26" fill="#f4f6f8"/>
    <circle cx="240" cy="196" r="26" fill="#f4f6f8"/>
    <circle cx="304" cy="196" r="26" fill="#ef4444"/>
    <circle cx="368" cy="196" r="26" fill="#ef4444"/>
  </g>
  <!-- specular highlights -->
  <g fill="#ffffff" opacity="0.55">
    <circle cx="168" cy="188" r="7"/>
    <circle cx="232" cy="188" r="7"/>
    <circle cx="296" cy="188" r="7" opacity="0.7"/>
    <circle cx="360" cy="188" r="7" opacity="0.7"/>
  </g>

  <!-- wordmark -->
  <text x="256" y="438" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="64" font-weight="700" letter-spacing="6" fill="#e6edf3">PAPI</text>
</svg>
